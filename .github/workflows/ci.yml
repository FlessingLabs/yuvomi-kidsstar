name: Tests and container image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/flessinglabs/yuvomi-kidsstar
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: sidecar
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Startet das gebaute Image einmal und fragt /health: faengt fehlende
      # Dateien im Image (z. B. public/tablet) ab, die die Tests nicht sehen.
      - name: Smoke test image
        run: |
          docker run -d --name ks -p 18080:8080 -e PROXY_YUVOMI=false ghcr.io/flessinglabs/yuvomi-kidsstar:sha-${GITHUB_SHA::7}
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18080/api/extensions/kidsstar/health && break; sleep 1; done
          curl -sf http://127.0.0.1:18080/api/extensions/kidsstar/tablet/ | grep -q app.js
          docker logs ks

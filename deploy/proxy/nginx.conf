# nginx vor Yuvomi und KidsStar (Betriebsart B, KidsStar mit PROXY_YUVOMI=false).
# Der KidsStar-Block steht VOR "location /", damit er gewinnt.
server {
    listen 443 ssl;
    server_name yuvomi.example.org;
    # ssl_certificate ...; ssl_certificate_key ...;

    client_max_body_size 4m;   # Bilder bis 2 MB

    location /api/extensions/kidsstar/ {
        proxy_pass http://kidsstar:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://yuvomi:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
